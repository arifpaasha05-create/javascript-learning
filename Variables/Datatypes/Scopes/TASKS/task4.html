<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price & Tax Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg border border-slate-200">
        
        <!-- Header -->
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-slate-800">💰 Price & Tax Calculator</h1>
            <p class="text-sm text-slate-500 mt-1">Calculates final price with optional tax (Default: 5%)</p>
        </div>

        <!-- Form Elements -->
        <div class="space-y-4">
            <!-- Product Price Input -->
            <div>
                <label for="priceInput" class="block text-sm font-semibold text-slate-700 mb-1">
                    Product Price (₹) <span class="text-red-500">*</span>
                </label>
                <input 
                    type="number" 
                    id="priceInput" 
                    placeholder="e.g. 1000" 
                    min="0"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-800"
                >
            </div>

            <!-- Tax Input (Optional) -->
            <div>
                <label for="taxInput" class="block text-sm font-semibold text-slate-700 mb-1">
                    Tax Rate (%) <span class="text-xs text-slate-400 font-normal">(Optional, defaults to 5%)</span>
                </label>
                <input 
                    type="number" 
                    id="taxInput" 
                    placeholder="Leave empty for default 5%" 
                    min="0"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-800"
                >
            </div>

            <!-- Calculate Button with onclick -->
            <button 
                type="button" 
                onclick="handleCalculatePrice()" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition duration-200"
            >
                Calculate Final Price
            </button>
        </div>

        <!-- Result Card -->
        <div id="resultContainer" class="hidden mt-6 p-4 bg-indigo-50 rounded-xl border border-indigo-100 space-y-2">
            <div class="flex justify-between text-sm text-slate-600">
                <span>Base Price:</span>
                <span id="displayBasePrice" class="font-medium text-slate-800">₹0</span>
            </div>
            <div class="flex justify-between text-sm text-slate-600">
                <span id="displayTaxLabel">Tax Applied (5%):</span>
                <span id="displayTaxAmount" class="font-medium text-slate-800">₹0</span>
            </div>
            <div class="border-t border-indigo-200 pt-2 flex justify-between items-center text-base font-bold text-indigo-900">
                <span>Final Price:</span>
                <span id="displayFinalPrice" class="text-xl text-indigo-600">₹0</span>
            </div>
        </div>

    </div>

    
</body>
</html>
