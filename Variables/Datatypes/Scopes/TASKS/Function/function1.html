<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Watch Live Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">

  
    <div class="w-64 h-64 rounded-full bg-slate-800 border-4 border-black-700 shadow-2xl flex items-center justify-center p-3 ring-4 ring-slate-950/40">
        

        <div class="w-full h-full rounded-full bg-white flex flex-col items-center justify-center shadow-inner text-center border border-gray-200">
            <h1 class="text-xs tracking-widest uppercase font-semibold text-blue-600 mb-1">Live Clock</h1>
            <h2 id="clock" class="text-3xl font-mono font-bold text-green-600 tracking-wider"></h2>
        </div>

    </div>

    <script src="function1.js"></script>
</body>
</html>
