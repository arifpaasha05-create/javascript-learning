<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md border border-gray-200 text-center max-w-sm w-full">
        
      
        <span class="inline-block bg-red-100 text-red-600 text-xs font-semibold px-3 py-1 rounded-full mb-3">
            🔥 Limited Time Offer
        </span>

     
        <h1 class="text-2xl font-bold text-gray-800 mb-1">
            Special Offer
        </h1>
        <p class="text-gray-500 text-sm mb-4">Ends in:</p>

      
        <div class="bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 mb-5">
            <h2 id="timer" class="text-2xl font-mono font-bold text-red-600"></h2>
        </div>

      
        <button class="w-full bg-blue-600 hover:bg-red-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-150">
            Shop Now
        </button>

    </div>

    <script src="./function2.js"></script>
</body>
</html>
