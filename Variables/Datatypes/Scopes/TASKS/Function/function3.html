<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop/Start Timer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 text-center max-w-xs w-full">
        
  
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Stopwatch</h1>

       
        <div class="bg-gray-50 border border-gray-200 rounded-xl py-6 px-4 mb-6 shadow-inner">
            <h2 id="timer" class="text-5xl font-mono font-bold text-gray-900 tracking-wider">0</h2>
        </div>

        
        <div class="flex items-center justify-center gap-3">
            <button onclick="startTimer()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-emerald-500/20 transition duration-150 cursor-pointer">
                Start
            </button>
            <button onclick="stopTimer()" class="flex-1 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-rose-500/20 transition duration-150 cursor-pointer">
                Stop
            </button>
        </div>

    </div>

    <script src="function3.js"></script> 
</body>
</html>
