<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center w-96">
        <h1 class="text-3xl font-bold text-blue-600 mb-6">Memory Game</h1>
        <h2 id="number" class="text-4xl font-bold text-red-500 h-12"></h2>
        <input
         type="number"
         id="answer" 
         placeholder="Enter a number"
        class="border border-gray-300 rounded-lg  p-2 w-full mb-4"
        onkeydown="if(event.key === 'Enter') checkAnswer()">
        <p id="score" class="text-xl font-bold mb-4">Score: 0</p>
        <button
         onclick="startGame()"
         class="bg-green-500 text-white px-5 py-2 rounded-lg mr-2">Start Game</button>
         <button 
          onclick="checkAnswer()"
          class="bg-blue-500 text-white px-5 py-2 rounded-lg">Submit</button>
    </div>
    <script src="task3.js"></script>
    
</body>
</html>
